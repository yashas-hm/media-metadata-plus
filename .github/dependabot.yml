version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pub-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "ffmpeg-next"
      # Major bumps need a matching prebuilt rebuild (see rust/Cargo.toml) —
      # kept separate so they're never bundled with routine updates.
      ffmpeg-next-major:
        patterns:
          - "ffmpeg-next"
        update-types:
          - "major"
    ignore:
      # Pinned to an exact version and must stay in lockstep with the
      # Dart-side flutter_rust_bridge dependency — bump both together by hand.
      - dependency-name: "flutter_rust_bridge"
