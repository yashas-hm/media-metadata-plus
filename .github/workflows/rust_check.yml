name: Rust Analyze

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'rust/src/frb_generated.rs'
      - 'flutter_rust_bridge.yaml'
      - '.github/workflows/rust_check.yml'

jobs:
  rust-analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Resolve FFmpeg tag
        run: |
          TAG="$(cat scripts/ci/ffmpeg_prebuilt_tag)"
          echo "FFMPEG_PREBUILT_BASE=https://github.com/yashas-hm/media-metadata-plus/releases/download/ffmpeg-prebuilt-${TAG}" >> $GITHUB_ENV

      - name: Download prebuilt FFmpeg
        run: |
          mkdir -p ffmpeg-prebuilt
          curl -fsSL "${{ env.FFMPEG_PREBUILT_BASE }}/x86_64-unknown-linux-gnu.zip" -o ffmpeg.zip
          unzip -q ffmpeg.zip -d ffmpeg-prebuilt
          rm ffmpeg.zip

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Build
        working-directory: rust
        env:
          FFMPEG_DIR: ${{ github.workspace }}/ffmpeg-prebuilt/x86_64-unknown-linux-gnu
        run: cargo build

      - name: Clippy
        working-directory: rust
        env:
          FFMPEG_DIR: ${{ github.workspace }}/ffmpeg-prebuilt/x86_64-unknown-linux-gnu
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: rust
        env:
          FFMPEG_DIR: ${{ github.workspace }}/ffmpeg-prebuilt/x86_64-unknown-linux-gnu
        run: cargo test

      - name: Cleanup Rust target dir
        if: always()
        run: rm -rf rust/target
