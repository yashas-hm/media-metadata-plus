name: Release

# Two ways in:
#   1. A PR containing "[vX.Y.Z]" in its title (e.g. "chore: [v1.5.0]") merging
#      into main — see pr_title_check.yml for the required title prefix.
#   2. Manual workflow_dispatch with a version input.
# Both funnel through versioning first, which bumps every version-bearing
# file, commits, and tags — only then do the platform builds and publish run.
# There is deliberately no `push: tags:` trigger: the tag is always created
# by this workflow itself, never pushed directly by a person.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0)'
        required: true
        type: string
      publish:
        description: 'Publish to pub.dev after releasing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # create GitHub Release + push version-bump/Package.swift commits
  id-token: write   # pub.dev OIDC trusted publisher

jobs:

  # ── Bump version, commit, tag ────────────────────────────────────────────────
  versioning:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.title, '[v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(echo "${{ github.event.pull_request.title }}" | grep -oE '\[v[0-9]+\.[0-9]+\.[0-9]+\]' | tr -d '[]')
          fi
          [[ "$VERSION" != v* ]] && VERSION="v$VERSION"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not determine a valid vX.Y.Z version (got: '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::notice::Tag $VERSION already exists on origin — skipping bump/commit/tag."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version files
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          NEW_VERSION="${NEW_VERSION#v}"
          OLD_VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //')"

          sed -i "s/${OLD_VERSION}/${NEW_VERSION}/g" \
            pubspec.yaml \
            rust/Cargo.toml \
            ios/media_metadata_plus.podspec \
            macos/media_metadata_plus.podspec \
            android/build.gradle.kts \
            macos/media_metadata_plus/Package.swift \
            ios/media_metadata_plus/Package.swift

      - name: Commit and tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="bot/release-$VERSION"

          if ! git diff --quiet; then
            git add \
              pubspec.yaml \
              rust/Cargo.toml \
              ios/media_metadata_plus.podspec \
              macos/media_metadata_plus.podspec \
              android/build.gradle.kts \
              macos/media_metadata_plus/Package.swift \
              ios/media_metadata_plus/Package.swift
            git commit -m "chore: bump version to $VERSION"
          fi

          git push origin "HEAD:refs/heads/$BRANCH"
          git tag "$VERSION"
          git push origin "$VERSION"

  # ── macOS + iOS ────────────────────────────────────────────────────────────
  build-apple:
    needs: versioning
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bot/release-${{ needs.versioning.outputs.version }}

      - name: Resolve FFmpeg tag
        run: |
          TAG="$(cat scripts/ci/ffmpeg_prebuilt_tag)"
          echo "FFMPEG_PREBUILT_BASE=https://github.com/yashas-hm/media-metadata-plus/releases/download/ffmpeg-prebuilt-${TAG}" >> $GITHUB_ENV

      - name: Install Rust targets
        working-directory: rust
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios

      - name: Download prebuilt FFmpeg
        run: |
          mkdir -p ffmpeg-prebuilt
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios; do
            curl -fsSL "${{ env.FFMPEG_PREBUILT_BASE }}/${target}.zip" -o "${target}.zip"
            unzip -q "${target}.zip" -d ffmpeg-prebuilt
            rm "${target}.zip"
          done

      - name: Build macOS xcframework
        env:
          FFMPEG_PREBUILT_DIR: ${{ github.workspace }}/ffmpeg-prebuilt
        run: bash scripts/ci/build_macos.sh

      - name: Build iOS xcframework
        env:
          FFMPEG_PREBUILT_DIR: ${{ github.workspace }}/ffmpeg-prebuilt
        run: bash scripts/ci/build_ios.sh

      - name: Zip xcframeworks
        run: |
          cd macos/Frameworks
          zip -r -y "../../macos_${{ needs.versioning.outputs.version }}.xcframework.zip" media_metadata_plus.xcframework
          cd ../../ios/Frameworks
          zip -r -y "../../ios_${{ needs.versioning.outputs.version }}.xcframework.zip" media_metadata_plus.xcframework

      - uses: actions/upload-artifact@v7
        with:
          name: apple
          path: |
            macos/Frameworks/
            ios/Frameworks/
            macos_*.xcframework.zip
            ios_*.xcframework.zip

      - name: Cleanup Rust target dir
        if: always()
        run: rm -rf rust/target

  # ── Linux + Android ────────────────────────────────────────────────────────
  build-linux-android:
    needs: versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bot/release-${{ needs.versioning.outputs.version }}

      - name: Resolve FFmpeg tag
        run: |
          TAG="$(cat scripts/ci/ffmpeg_prebuilt_tag)"
          echo "FFMPEG_PREBUILT_BASE=https://github.com/yashas-hm/media-metadata-plus/releases/download/ffmpeg-prebuilt-${TAG}" >> $GITHUB_ENV

      - name: Install Rust targets
        working-directory: rust
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - uses: android-actions/setup-android@v4
      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Download prebuilt FFmpeg
        run: |
          mkdir -p ffmpeg-prebuilt
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android; do
            curl -fsSL "${{ env.FFMPEG_PREBUILT_BASE }}/${target}.zip" -o "${target}.zip"
            unzip -q "${target}.zip" -d ffmpeg-prebuilt
            rm "${target}.zip"
          done

      - name: Build Linux .so
        env:
          FFMPEG_DIR: ${{ github.workspace }}/ffmpeg-prebuilt/x86_64-unknown-linux-gnu
        working-directory: rust
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Stage Linux .so
        run: cp rust/target/x86_64-unknown-linux-gnu/release/libmedia_metadata_plus.so linux/

      - name: Build Android .so (4 ABIs)
        env:
          FFMPEG_PREBUILT_DIR: ${{ github.workspace }}/ffmpeg-prebuilt
        run: bash scripts/ci/build_android.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-android
          path: |
            linux/libmedia_metadata_plus.so
            android/src/main/jniLibs/

      - name: Cleanup Rust target dir
        if: always()
        run: rm -rf rust/target

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    needs: versioning
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bot/release-${{ needs.versioning.outputs.version }}

      - name: Resolve FFmpeg tag
        shell: bash
        run: |
          TAG="$(cat scripts/ci/ffmpeg_prebuilt_tag)"
          echo "FFMPEG_PREBUILT_BASE=https://github.com/yashas-hm/media-metadata-plus/releases/download/ffmpeg-prebuilt-${TAG}" >> $GITHUB_ENV

      - name: Download prebuilt FFmpeg
        shell: pwsh
        run: |
          $url = "${{ env.FFMPEG_PREBUILT_BASE }}/x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-prebuilt

      - name: Build Windows .dll
        working-directory: rust
        env:
          FFMPEG_DIR: ${{ github.workspace }}\ffmpeg-prebuilt\x86_64-pc-windows-msvc
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage DLL
        shell: cmd
        run: copy rust\target\x86_64-pc-windows-msvc\release\media_metadata_plus.dll windows\

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: windows/media_metadata_plus.dll

      - name: Cleanup Rust target dir
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force rust/target

  # ── Release + pub.dev publish ──────────────────────────────────────────────
  release-and-publish:
    needs: [versioning, build-apple, build-linux-android, build-windows]
    runs-on: ubuntu-latest
    environment: pub.dev  # must match the environment name set on pub.dev automated publishing
    permissions:
      contents: write       # create release + push Package.swift commit
      pull-requests: write  # open the main-sync PR
      id-token: write       # pub.dev OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bot/release-${{ needs.versioning.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with: { name: apple,         path: . }

      - uses: actions/download-artifact@v8
        with: { name: linux-android, path: . }

      - uses: actions/download-artifact@v8
        with: { name: windows,       path: windows/ }

      # Upload xcframeworks to GitHub Release (SPM binaryTarget URLs)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.versioning.outputs.version }}
          name: ${{ needs.versioning.outputs.version }}
          files: |
            macos_${{ needs.versioning.outputs.version }}.xcframework.zip
            ios_${{ needs.versioning.outputs.version }}.xcframework.zip
          generate_release_notes: true

      # SHA256 hex is the checksum format SPM expects
      - name: Compute checksums
        id: sums
        run: |
          echo "macos=$(sha256sum macos_${{ needs.versioning.outputs.version }}.xcframework.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "ios=$(sha256sum ios_${{ needs.versioning.outputs.version }}.xcframework.zip   | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      # Stamp Package.swift placeholders with real URLs + checksums
      - name: Stamp Package.swift
        env:
          VERSION: ${{ needs.versioning.outputs.version }}
          MACOS_SUM: ${{ steps.sums.outputs.macos }}
          IOS_SUM:   ${{ steps.sums.outputs.ios }}
        run: |
          BASE="https://github.com/yashas-hm/media-metadata-plus/releases/download/${VERSION}"
          sed -i "s|url: \".*macos.*\"|url: \"${BASE}/macos_${VERSION}.xcframework.zip\"|"  macos/media_metadata_plus/Package.swift
          sed -i "s|checksum: \".*\" // macos|checksum: \"${MACOS_SUM}\" // macos|"         macos/media_metadata_plus/Package.swift
          sed -i "s|url: \".*ios.*\"|url: \"${BASE}/ios_${VERSION}.xcframework.zip\"|"      ios/media_metadata_plus/Package.swift
          sed -i "s|checksum: \".*\" // ios|checksum: \"${IOS_SUM}\" // ios|"               ios/media_metadata_plus/Package.swift

      - name: Cleanup zips
        run: rm -f macos_*.xcframework.zip ios_*.xcframework.zip

      # Commit stamped Package.swift before publish so the working tree is clean
      - name: Commit updated Package.swift
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macos/media_metadata_plus/Package.swift ios/media_metadata_plus/Package.swift
          git commit -m "chore: update SPM checksums for ${{ needs.versioning.outputs.version }}"
          git push origin HEAD:bot/release-${{ needs.versioning.outputs.version }}

      # main is protected — the version-bump and checksum commits live on
      # the bot branch, never on main. Open a PR so a human merges them in.
      - name: Open PR to sync main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bot/release-${{ needs.versioning.outputs.version }}"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: sync main for ${{ needs.versioning.outputs.version }} release" \
            --body "Version bump + SPM checksum updates from the ${{ needs.versioning.outputs.version }} release run." \
            || echo "PR already exists (or nothing to merge) for $BRANCH."

      - name: Stop here for test runs
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: echo "Manual run without publish — stopping after release + checksum commit." && exit 0

      # Publish to pub.dev — binaries + stamped Package.swift are in the tarball
      - uses: subosito/flutter-action@v2     # install Flutter (and its bundled Dart) first
        with:
          channel: stable
      - uses: dart-lang/setup-dart@v1.8.0   # OIDC token exchange runs last so credentials aren't overwritten

      - name: Validate package (dry run)
        run: flutter pub publish --dry-run

      - name: Publish to pub.dev
        run: flutter pub publish --force

  # ── Roll back the tag + GitHub Release if anything above failed ─────────────
  cleanup-on-failure:
    needs: [versioning, build-apple, build-linux-android, build-windows, release-and-publish]
    if: |
      always() &&
      needs.versioning.result == 'success' &&
      (needs.build-apple.result == 'failure' || needs.build-linux-android.result == 'failure' || needs.build-windows.result == 'failure' || needs.release-and-publish.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Delete GitHub Release, if one was created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.versioning.outputs.version }}"
          gh release delete "$VERSION" --yes || echo "No release to delete for $VERSION."

      - name: Close sync-main PR, if one was opened
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bot/release-${{ needs.versioning.outputs.version }}"
          gh pr close "$BRANCH" --delete-branch=false --comment "Closing: release run failed, rolling back this release." \
            || echo "No open PR for $BRANCH."

      - name: Delete tag
        run: |
          VERSION="${{ needs.versioning.outputs.version }}"
          git push origin --delete "$VERSION" || echo "Tag $VERSION already gone."

      - name: Delete bot branch, if one was created
        run: |
          VERSION="${{ needs.versioning.outputs.version }}"
          git push origin --delete "bot/release-$VERSION" || echo "Branch bot/release-$VERSION already gone."
