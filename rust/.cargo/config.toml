# bcrypt: av_get_random_seed() in libavutil uses BCryptGenRandom.
# user32: hwcontext_dxva2 in libavutil pulls in GetDesktopWindow.
# secur32/ncrypt/crypt32: tls_schannel.o in libavformat uses SChannel (Secur32),
# CNG key storage (Ncrypt), and cert/ASN.1 helpers (Crypt32) for its TLS backend.
# None of these are auto-linked by the MSVC linker.
[target.x86_64-pc-windows-msvc]
rustflags = ["-l", "bcrypt", "-l", "user32", "-l", "secur32", "-l", "ncrypt", "-l", "crypt32"]
